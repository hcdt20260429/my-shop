name: Update Product List from Google Drive

on:
  workflow_dispatch # 允許手動觸發
  schedule:
    - cron: '0 0 * * *' # 每天午夜執行一次 (UTC 時間)

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Python script to update products.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python update_products.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --quiet --exit-code || git commit -m "Auto-update products.json from Google Drive"
          git push
