<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的商品線上目錄</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .card { max-width: 500px; width: 100%; background: #ffffff; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        .logo-icon { font-size: 60px; margin-bottom: 20px; }
        h1 { font-size: 28px; color: #2c3e50; margin-bottom: 12px; font-weight: bold; }
        p { font-size: 15px; color: #7f8c8d; margin-bottom: 35px; line-height: 1.6; }
        
        .btn-enter { display: inline-block; width: 100%; padding: 16px 20px; background: linear-gradient(135deg, #4285F4 0%, #34A853 100%); color: white; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 50px; box-shadow: 0 5px 15px rgba(66,133,244,0.3); transition: all 0.3s ease; }
        .btn-enter:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(66,133,244,0.5); }
        .tip { font-size: 12px; color: #b2bec3; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-icon">🛍️</div>
        <h1>我的商品線上目錄</h1>
        <p>歡迎光臨！我們準備了 260 款以上的精選商品。請點擊下方按鈕開啟專屬相簿，即可自由瀏覽、點擊放大看細節與下載囉！</p>
        
        <!-- ==================== 你的核心代碼就在下方這行 ==================== -->
        <a href="https://drive.google.com/drive/folders/1GPHOg02T2ABewVAtFgIUiSBeiwmqgGK6" target="_blank" class="btn-enter">
            ✨ 點此開啟商品相簿牆 ✨
        </a>
        <!-- =================================================================== -->
        
        <div class="tip">※ 支援手機與電腦瀏覽，可隨時放大觀看</div>
    </div>

</body>
</html>
