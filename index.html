<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的商品線上目錄</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f4f6f9; padding: 20px; text-align: center; }
        
        .container { max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 26px; color: #2c3e50; margin-bottom: 8px; font-weight: bold; }
        p { font-size: 14px; color: #7f8c8d; margin-bottom: 25px; }
        
        /* 雲端硬碟自適應容器 */
        .drive-wrapper { position: relative; width: 100%; height: 80vh; min-height: 600px; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>我的商品線上目錄</h1>
        <p>💡 點擊下方任何一張商品圖片，即可直接「放大預覽」並觀看細節喔！</p>
        
        <!-- 已為您綁定專屬 Google 雲端硬碟 ID -->
        <div class="drive-wrapper">
            <iframe src="https://google.com"></iframe>
        </div>
    </div>

</body>
</html>
